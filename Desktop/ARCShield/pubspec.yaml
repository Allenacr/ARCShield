name: arcshield
description: >
  ARCShield — Real-time UPI fraud detection, coercion checks before risky
  transfers, and quarantine protection for unexpected incoming money.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Backend / auth ────────────────────────────────────────
  supabase_flutter: ^2.5.11        # Supabase Auth + Postgres/Realtime client
  http: ^1.2.2                     # calls to the FastAPI scoring/action endpoints

  # ── Push notifications (F-18) ─────────────────────────────
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # ── State management ──────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── UI ─────────────────────────────────────────────────────
  fl_chart: ^0.68.0                # available / held / total balance visualisation
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0                  # loading states on the alert card
  mobile_scanner: ^5.2.3           # QR code / barcode scanner

  # ── Formatting / utilities ────────────────────────────────
  intl: ^0.19.0                    # ₹ currency and date formatting
  collection: ^1.18.0

  # ── Local secure storage (session, device fingerprint seed) ─
  flutter_secure_storage: ^9.2.2

  # ── Data classes ───────────────────────────────────────────
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  # ── Device / session signals (F-27, simulated) ────────────
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ── Code generation ────────────────────────────────────────
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

  # ── Testing ─────────────────────────────────────────────────
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  # fonts:
  #   - family: IBMPlexSans
  #     fonts:
  #       - asset: assets/fonts/IBMPlexSans-Regular.ttf
  #       - asset: assets/fonts/IBMPlexSans-Medium.ttf
  #         weight: 500
